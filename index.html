

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        /* Page Styling */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Container */
        .container {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        h2 {
            color: #764ba2;
            margin-top: 5px;
        }

        /* Input Styling */
        input {
            width: 65%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #764ba2;
        }

        /* Button Styling */
        button {
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            background-color: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #4b5fc5;
        }

        /* Task List */
        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        li {
            background-color: #f2f2f2;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow-wrap: anywhere;
        }

        /* Delete Button */
        li button {
            background-color: #e74c3c;
            padding: 7px 12px;
            margin-left: 10px;
        }

        li button:hover {
            background-color: #c0392b;
        }

        /* Clear All Button */
        .clear-btn {
            background-color: #e74c3c;
            width: 100%;
            margin-top: 10px;
        }

        .clear-btn:hover {
            background-color: #c0392b;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>
        <h2>Manage Your Tasks</h2>

        <input id="task" placeholder="Enter a new task">

        <button onclick="addTask()">Add</button>

        <ul id="list"></ul>

        <button class="clear-btn" onclick="clearAll()">
            Clear All
        </button>

    </div>

    <script>

        let tasks = [];

        function displayTasks() {

            let html = "";

            for (let i = 0; i < tasks.length; i++) {

                html += "<li>" + tasks[i] +
                " <button onclick='removeTask(" + i + ")'>X</button></li>";

            }

            document.getElementById("list").innerHTML = html;
        }

        function addTask() {

            let taskInput = document.getElementById("task");

            let text = taskInput.value.trim();

            if (text === "") {
                alert("Please enter a task");
                return;
            }

            tasks.push(text);

            taskInput.value = "";

            saveTasks();

            displayTasks();
        }

        function removeTask(i) {

            tasks.splice(i, 1);

            saveTasks();

            displayTasks();
        }

        function clearAll() {

            tasks = [];

            saveTasks();

            displayTasks();
        }

        function saveTasks() {

            localStorage.setItem("tasks", JSON.stringify(tasks));

        }

        function loadTasks() {

            let saved = localStorage.getItem("tasks");

            if (saved !== null) {
                tasks = JSON.parse(saved);
            }
        }

        loadTasks();

        displayTasks();

    </script>

</body>
</html>
